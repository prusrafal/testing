name: Auto commit

on:
  schedule:
    - cron: "0 7,9,11 * * 1,3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > LAST_UPDATED

      - name: Commit changes
        run: |
          git config user.name "prusrafal"
          git config user.email "prus.rafal@icloud.com"

          git add LAST_UPDATED

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          EMOJIS=("😂" "😱" "👿" "💩" "🙏" "🙈" "🐐" "🤖" "🟩" "👻")
          RAND=$((RANDOM % ${#EMOJIS[@]}))

          git commit -m "chore(bot): ${EMOJIS[$RAND]} auto commit"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:master
